<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Nini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <canvas id="maze"></canvas>

    <div class="dpad">
      <button class="dpad__btn dpad__up" data-dx="0" data-dy="-1">▲</button>
      <button class="dpad__btn dpad__left" data-dx="-1" data-dy="0">◀</button>
      <button class="dpad__btn dpad__right" data-dx="1" data-dy="0">▶</button>
      <button class="dpad__btn dpad__down" data-dx="0" data-dy="1">▼</button>
    </div>

    <button id="restart">Reiniciar laberinto</button>
  </div>

  <div id="win" class="win hidden">
    <h2 id="win-text"></h2>
    <button id="play-again">Jugar de nuevo</button>
  </div>

  <audio id="win-audio" src="song.mp3"></audio>

  <script src="maze.js"></script>
</body>
</html>
